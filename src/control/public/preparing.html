<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Preparando...</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
  background: linear-gradient(135deg, #0a0a0c 0%, #1a1a2e 50%, #16213e 100%);
  color: #f5f5f7;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(at 30% 30%, rgba(191, 90, 242, 0.12) 0%, transparent 50%),
    radial-gradient(at 70% 60%, rgba(10, 132, 255, 0.10) 0%, transparent 50%);
}
.logo {
  width: 64px; height: 64px; border-radius: 18px;
  background: linear-gradient(135deg, #0a84ff, #bf5af2);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  box-shadow: 0 8px 32px rgba(10, 132, 255, 0.3);
  position: relative; z-index: 1;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-top-color: #0a84ff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  position: relative; z-index: 1;
}
@keyframes spin { to { transform: rotate(360deg); } }
.title {
  font-size: 17px; font-weight: 700;
  position: relative; z-index: 1;
}
.subtitle {
  font-size: 13px; color: rgba(245, 245, 247, 0.5);
  position: relative; z-index: 1;
  text-align: center; max-width: 280px;
}
.progress-bar {
  width: 200px; height: 4px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px; overflow: hidden;
  position: relative; z-index: 1;
}
.progress-fill {
  height: 100%; width: 30%;
  background: linear-gradient(90deg, #0a84ff, #bf5af2);
  border-radius: 2px;
  animation: slide 1.5s ease-in-out infinite;
}
@keyframes slide {
  0% { width: 0%; margin-left: 0%; }
  50% { width: 70%; margin-left: 15%; }
  100% { width: 0%; margin-left: 100%; }
}
</style>
</head>
<body>
  <div class="logo">🤖</div>
  <div class="spinner"></div>
  <div class="title">Preparando ambiente...</div>
  <div class="subtitle">Extraindo dependências e configurando o bot.<br>Isso pode levar alguns segundos.</div>
  <div class="progress-bar"><div class="progress-fill"></div></div>
</body>
</html>
