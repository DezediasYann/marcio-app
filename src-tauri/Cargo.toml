[package]
name = "marcio-app"
version = "1.0.3-6"
description = "Márcio App — bot do WhatsApp com IA"
authors = []
edition = "2021"

# Veja mais chaves em https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "marcio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Crate nativo pra extrair ZIPs sem depender de comando externo (unzip/powershell).
# Funciona em Windows, macOS e Linux sem dependências do sistema.
zip = "2"

[features]
# Esta feature é usada pra produção (gera .exe standalone).
# Por padrão (dev), usa custom-protocol = false.
custom-protocol = ["tauri/custom-protocol"]
