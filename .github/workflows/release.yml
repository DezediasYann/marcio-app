name: Release

# Trigger: quando você criar uma tag tipo "v1.0.2"
# O GitHub Actions compila o .exe/.AppImage, assina, e publica um release
# O updater do Tauri busca o latest.json em releases/latest/download/latest.json
on:
  push:
    tags:
      - 'v*'

# Permissões pra criar release e fazer upload de assets
permissions:
  contents: write

jobs:
  # Job 1: Gera o body da release a partir do changelog.json (roda uma vez só)
  # Converte o JSON em markdown pra usar como descrição da release no GitHub.
  generate-changelog:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar markdown do changelog
        id: changelog
        run: |
          # Lê changelog.json e converte pra markdown usando node
          BODY=$(node -e '
            const cl = require("./changelog.json");
            const tag = process.env.GITHUB_REF_NAME || "v0.0.0";
            const version = tag.replace(/^v/, "");
            // Encontra o release da versão atual (ou usa o mais recente)
            const release = cl.releases.find(r => r.version === version) || cl.releases[0];
            if (!release) { console.log("Sem changelog."); process.exit(0); }
            let md = `## ${release.title || "v" + release.version}\n\n`;
            if (release.date) md += `📅 ${release.date}\n\n`;
            for (const section of (release.sections || [])) {
              md += `### ${section.icon || "✨"} ${section.title}\n\n`;
              for (const item of (section.items || [])) {
                md += `- ${item}\n`;
              }
              md += `\n`;
            }
            md += `\n---\n📦 Baixe o instalador da sua plataforma abaixo.\n`;
            md += `🔄 Se você já tem o app instalado, ele vai detectar a atualização automaticamente.`;
            console.log(md);
          ')
          # Salva como output (escape de newlines pro GITHUB_OUTPUT)
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

  # Job 2: Compila pra cada plataforma
  release:
    needs: generate-changelog
    strategy:
      matrix:
        # Build pra Windows e Linux (macOS desativado — muito problemático)
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # NOTA: libappindicator3-dev e libayatana-appindicator3-dev CONFLITAM.
          # Instalamos só o libayatana (versão moderna usada pelo Tauri 2).
          # unzip é fallback do extract_zip em runtime (na maioria dos casos o crate nativo resolve).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev zip unzip

      - name: Install npm dependencies
        run: npm install

      # ⚠️ DIAGNÓSTICO DE SIGNING — verifica se os secrets tão configurados
      # ANTES do build. Se não tiverem, o build vai completar mas latest.json
      # não vai ser gerado. Isso nos dá info útil sem precisar esperar 20min.
      - name: Diagnóstico de signing (debug)
        shell: bash
        env:
          SK: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SP: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "=== DIAGNÓSTICO DE SIGNING ==="
          echo ""
          echo "Secret TAURI_SIGNING_PRIVATE_KEY:"
          if [ -z "$SK" ]; then
            echo "  ❌ VAZIO! Configure em Settings → Secrets → Actions"
          else
            # Mostra tamanho + primeiros caracteres (não expõe a chave)
            LEN=${#SK}
            FIRST=${SK:0:30}
            LAST=${SK: -10}
            echo "  ✅ Configurado (tamanho: $LEN chars)"
            echo "  Início: $FIRST..."
            echo "  Fim: ...$LAST"
            # Verifica se começa com o cabeçalho esperado
            if [[ "$SK" == *"BEGIN ENCRYPTED PRIVATE KEY"* ]] || [[ "$SK" == *"untrusted comment"* ]]; then
              echo "  ✅ Formato parece correto (tem cabeçalho minisign/PEM)"
            elif [[ "$SK" == /* ]] || [[ "$SK" == *":\\"* ]] || [[ "$SK" == "$HOME"* ]]; then
              echo "  ⚠️ Parece um CAMINHO de arquivo, não o conteúdo"
              echo "     → No GitHub Actions, cole o CONTEÚDO do arquivo .key, não o caminho"
            else
              echo "  ⚠️ Formato desconhecido — pode ser base64 ou ter sido corrompido"
              echo "     → Cole o conteúdo DIRETO do arquivo .key (começa com -----BEGIN...)"
            fi
            # Verifica se tem newlines (crítico pra chave funcionar)
            if [[ "$SK" == *$'\n'* ]]; then
              echo "  ✅ Tem newlines (multiline) — formato correto"
            else
              echo "  ⚠️ NÃO tem newlines — foi colado como uma linha só"
              echo "     → Isso pode causar falha no parsing pelo minisign"
            fi
          fi
          echo ""
          echo "Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD:"
          if [ -z "$SP" ]; then
            echo "  ❌ VAZIO! Configure a senha usada em 'npm run signer:generate'"
          else
            LEN_PWD=${#SP}
            echo "  ✅ Configurado (tamanho: $LEN_PWD chars)"
          fi
          echo ""
          echo "=== RESUMO ==="
          if [ -z "$SK" ] || [ -z "$SP" ]; then
            echo "❌ Signing NÃO vai funcionar — secrets faltando"
            echo "   Vá em: https://github.com/DezediasYann/marcio-app/settings/secrets/actions"
          else
            echo "✅ Secrets parecem configurados. Vamos ver se o build consegue usar..."
          fi

      # beforeBuildCommand (no tauri.conf.json) já roda:
      #   precopy.js + npm run build + prepare-bundle.js
      # prepare-bundle.js cria node_modules.zip, dist-bundle.zip e copia node-portable

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Márcio App ${{ github.ref_name }}'
          # Usa o changelog gerado no job anterior como corpo da release
          releaseBody: ${{ needs.generate-changelog.outputs.body }}
          # ⚠️ releaseDraft: false — PRECISA ser false pro updater funcionar!
          releaseDraft: false
          prerelease: false
          # ⚠️ Força usar `npm` em vez de `bun` (bun tem bug com top-level await
          # no bundle webpack do tauri-action — afeta Ubuntu e macOS runners
          # onde o bun vem pré-instalado).
          tauriScript: npm run tauri --
          args: ${{ matrix.args }}

      # ⚠️ CORREÇÃO CRÍTICA DO UPDATER:
      # O tauri-action@v0 JÁ sobe o latest.json automaticamente quando
      # TAURI_SIGNING_PRIVATE_KEY está configurado. MAS em alguns casos
      # o asset é sobrescrito ou vai com nome errado (latest.json do NSIS
      # vs latest.json do MSI — conflito de nome).
      #
      # Este step ROBUSTO faz upload EXPLÍCITO do latest.json gerado pelo
      # bundle NSIS (formato padrão Windows), garantindo que o asset
      # "latest.json" exista na release com o conteúdo certo.
      #
      # Usa `if: always()` pra rodar mesmo se o build do tauri-action falhar
      # parcialmente — só vai ter sucesso se o latest.json existir em disco.
      - name: Garantir latest.json na release (updater asset)
        if: always() && matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/latest.json

      # ⚠️ FALLBACK MANUAL: se o tauri-action não gerou o latest.json (signing falhou),
      # geramos manualmente usando a CLI do Tauri + minisign.
      # Esse step só roda se o latest.json NÃO existir.
      - name: Fallback — gerar latest.json manualmente se signing falhou
        if: always() && matrix.platform == 'windows-latest'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_PATH="src-tauri/target/release/bundle/nsis/latest.json"
          if [ -f "$LATEST_PATH" ]; then
            echo "✅ latest.json já existe — pulando fallback"
            exit 0
          fi
          
          echo "⚠️ latest.json NÃO existe — tentando gerar manualmente..."
          
          # Verifica que o .exe foi gerado
          EXE_PATH=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
          if [ -z "$EXE_PATH" ]; then
            echo "❌ .exe não encontrado — não dá pra gerar latest.json sem ele"
            exit 0
          fi
          EXE_NAME=$(basename "$EXE_PATH")
          echo "✅ .exe encontrado: $EXE_NAME"
          
          # Verifica que os secrets tão configurados
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY não configurado"
            exit 0
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY_PASSWORD não configurado"
            exit 0
          fi
          
          # Converte a chave privada pra base64 (uma linha só, sem newlines).
          # Isso é necessário porque:
          # - Passar o caminho do arquivo falha (Tauri tenta decodificar caminho como base64, falha no ":")
          # - Passar o conteúdo direto (multi-linha) falha (bash quebra em vários argumentos)
          # - Passar base64 funciona (uma linha só, decodificável pelo Tauri)
          KEY_BASE64=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -w 0)
          echo "🔑 Chave privada convertida pra base64 (tamanho: ${#KEY_BASE64} chars)"
          
          # Assina usando tauri signer sign com a chave em base64
          # Sintaxe: npx tauri signer sign --private-key <KEY_BASE64> --password <PWD> <FILE>
          echo "🔑 Assinando o .exe com npx tauri signer sign..."
          npx tauri signer sign --private-key "$KEY_BASE64" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$EXE_PATH" 2>&1
          SIGN_EXIT=$?
          
          if [ $SIGN_EXIT -ne 0 ]; then
            echo "❌ Falha ao assinar (exit code: $SIGN_EXIT)"
            exit 0
          fi
          
          # Verifica que o .sig foi gerado
          SIG_PATH="${EXE_PATH}.sig"
          if [ ! -f "$SIG_PATH" ]; then
            echo "❌ .sig não foi gerado"
            exit 0
          fi
          echo "✅ .sig gerado: $SIG_PATH"
          SIGNATURE=$(cat "$SIG_PATH")
          
          # Gera o latest.json manualmente
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/DezediasYann/marcio-app/releases/download/${GITHUB_REF_NAME}/${EXE_NAME}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          mkdir -p src-tauri/target/release/bundle/nsis
          
          # Gera o latest.json usando printf (evita problemas de escape do YAML)
          # Escapa aspas duplas da assinatura pra JSON válido
          SIG_ESCAPED=$(echo "$SIGNATURE" | sed 's/"/\\"/g' | tr -d '\n')
          printf '{\n  "version": "v%s",\n  "notes": "Márcio App v%s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "%s"\n    }\n  }\n}\n' \
            "$VERSION" "$VERSION" "$PUB_DATE" "$SIG_ESCAPED" "$URL" > "$LATEST_PATH"
          
          if [ -f "$LATEST_PATH" ]; then
            echo "✅ latest.json gerado manualmente!"
            echo "Conteúdo:"
            cat "$LATEST_PATH"
          else
            echo "❌ Falha ao gerar latest.json"
          fi

      # Upload manual do latest.json (usa GitHub CLI pra evitar erro de permissão
      # que acontecia com softprops/action-gh-release)
      - name: Upload latest.json via GitHub CLI
        if: always() && matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_PATH="src-tauri/target/release/bundle/nsis/latest.json"
          if [ ! -f "$LATEST_PATH" ]; then
            echo "❌ latest.json não encontrado — não dá pra fazer upload"
            exit 0
          fi
          echo "📦 Fazendo upload do latest.json via gh CLI..."
          gh release upload "${{ github.ref_name }}" "$LATEST_PATH" --clobber --repo "${{ github.repository }}"

      # Debug: lista os arquivos gerados pra podermos confirmar que o
      # latest.json foi criado (caso contrário, o updater não vai funcionar).
      # ⚠️ USA POWERSHELL no Windows (ls/cat/2>/dev/null NÃO funcionam lá).
      - name: Debug — listar bundles gerados (Windows)
        if: always() && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== BUNDLE DIR ==="
          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem "src-tauri/target/release/bundle" -Force | Format-Table -AutoSize
          } else {
            Write-Host "bundle dir não existe"
          }
          Write-Host ""
          Write-Host "=== NSIS BUNDLE ==="
          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Get-ChildItem "src-tauri/target/release/bundle/nsis" -Force | Format-Table -AutoSize
          } else {
            Write-Host "⚠️ nsis dir não existe"
          }
          Write-Host ""
          Write-Host "=== MSI BUNDLE ==="
          if (Test-Path "src-tauri/target/release/bundle/msi") {
            Get-ChildItem "src-tauri/target/release/bundle/msi" -Force | Format-Table -AutoSize
          } else {
            Write-Host "msi dir não existe"
          }
          Write-Host ""
          Write-Host "=== LATEST.JSON CONTEÚDO ==="
          $latestPath = "src-tauri/target/release/bundle/nsis/latest.json"
          if (Test-Path $latestPath) {
            Write-Host "✅ latest.json encontrado!"
            Get-Content $latestPath
          } else {
            Write-Host "❌ latest.json NÃO encontrado"
            Write-Host ""
            Write-Host "=== DIAGNÓSTICO ==="
            Write-Host "Se latest.json não foi gerado, possíveis causas:"
            Write-Host "1. Secret TAURI_SIGNING_PRIVATE_KEY não configurado ou inválido"
            Write-Host "2. Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD incorreto"
            Write-Host "3. Build do Tauri falhou antes de gerar o bundle"
            Write-Host ""
            Write-Host "=== VERIFICA SE .SIG EXISTE (indica que signing funcionou) ==="
            $sigFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.sig" -ErrorAction SilentlyContinue
            if ($sigFiles) {
              Write-Host "✅ Arquivos .sig encontrados (signing funcionou!):"
              $sigFiles | Format-Table -AutoSize
            } else {
              Write-Host "❌ NENHUM arquivo .sig encontrado — signing NÃO ocorreu"
              Write-Host "   → Verifique os secrets TAURI_SIGNING_PRIVATE_KEY e _PASSWORD"
            }
          }

      # Debug Linux (usa bash normal com 2>/dev/null)
      - name: Debug — listar bundles gerados (Linux)
        if: always() && matrix.platform == 'ubuntu-22.04'
        run: |
          echo "=== BUNDLE DIR ==="
          ls -la src-tauri/target/release/bundle/ 2>/dev/null || echo "bundle dir não existe"
          echo ""
          echo "=== APPIMAGE BUNDLE ==="
          ls -la src-tauri/target/release/bundle/appimage/ 2>/dev/null || echo "appimage dir não existe"
          echo ""
          echo "=== DEB BUNDLE ==="
          ls -la src-tauri/target/release/bundle/deb/ 2>/dev/null || echo "deb dir não existe"
