[package]
name = "marcio-app"
version = "1.0.4"
description = "Márcio App — bot do WhatsApp com IA"
authors = []
edition = "2021"

# Veja mais chaves em https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "marcio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# BUG FIX: tauri-plugin-updater por padrão habilita feature `zip` (que puxa
# o crate `zip` como dependência). Todas as versões 2.x e 4.x do crate `zip`
# foram yanked do crates.io, quebrando o build.
# Solução: desabilitar default-features e habilitar só o necessário (sem `zip`).
# Pra nosso caso (Windows NSIS .exe + Linux AppImage), não precisamos extrair
# .zip em runtime — o installer do Windows é .exe auto-extraível.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Crate nativo pra extrair ZIPs sem depender de comando externo (unzip/powershell).
# Funciona em Windows, macOS e Linux sem dependências do sistema.
# Versões 2.x e 3.0.0 foram yanked do crates.io — usar 9.x (mais recente disponível).
zip = "9"

[features]
# Esta feature é usada pra produção (gera .exe standalone).
# Por padrão (dev), usa custom-protocol = false.
custom-protocol = ["tauri/custom-protocol"]
